<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Philadelphia Slot Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="slot-machine-container">
    <h1>Philadelphia Sports Slot Machine</h1>
    <h2 id="balance">Balance: $100</h2>

    <div class="reels">
      <div class="reel" id="reel1"></div>
      <div class="reel" id="reel2"></div>
      <div class="reel" id="reel3"></div>
    </div>

    <div class="controls">
      <label for="bet">Select Bet:</label>
      <select id="bet">
        <option value="20">$20</option>
        <option value="50">$50</option>
        <option value="100">$100</option>
      </select>

      <button id="spinButton" class="lever">🎰 Pull Lever</button>
      <button id="restartButton" class="restart">🔄 Restart Game</button>
    </div>

    <div id="result"></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
